<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي | Mr. Mohammed Elhafawy</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>
    <style>
        :root {
            --bg-primary: #f6f4f0; --bg-card: #ffffff; --text-primary: #1e2a3a;
            --text-secondary: #4a5568; --text-muted: #718096; --border-color: #e2dcd0;
            --accent-1: #3182ce; --accent-2: #2b6cb0; --accent-3: #2c7a7b; --danger: #c53030;
            --gradient-1: linear-gradient(135deg, #3182ce, #2b6cb0, #2c7a7b);
            --radius-lg: 20px; --radius-md: 14px; --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06); --font: 'Cairo', sans-serif;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        body.dark {
            --bg-primary: #1a202c; --bg-card: #2d3748; --text-primary: #e2e8f0;
            --text-secondary: #a0aec0; --text-muted: #718096; --border-color: #4a5568;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3); --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg-primary); color:var(--text-primary); display:flex; min-height:100vh; transition: background 0.3s, color 0.3s; }
        .sidebar {
            width:260px; background:var(--bg-card); border-left:1px solid var(--border-color);
            padding:24px 14px; display:flex; flex-direction:column; gap:4px; flex-shrink:0;
            z-index:50; transition:transform 0.3s; box-shadow:var(--shadow-sm);
        }
        .sidebar .logo-icon { width:42px; height:42px; border-radius:var(--radius-md); background:var(--gradient-1); display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:1.1rem; margin-bottom:20px; overflow:hidden; }
        .sidebar .logo-icon img { width:100%; height:100%; object-fit:cover; border-radius:inherit; }
        .sidebar nav a { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:24px; color:var(--text-secondary); text-decoration:none; font-weight:500; font-size:0.88rem; margin-bottom:3px; transition:0.2s; }
        .sidebar nav a.active, .sidebar nav a:hover { background:rgba(49,130,206,0.08); color:var(--accent-2); }
        .main { flex:1; display:flex; flex-direction:column; overflow-y:auto; max-height:100vh; background:var(--bg-primary); }
        .topbar { padding:14px 24px; display:flex; justify-content:space-between; align-items:center; background:var(--bg-card); border-bottom:1px solid var(--border-color); position:sticky; top:0; z-index:20; box-shadow:var(--shadow-sm); }
        .topbar h2 { font-size:1.2rem; font-weight:700; background:var(--gradient-1); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .btn { padding:8px 16px; border-radius:24px; font-weight:600; font-size:0.82rem; border:1.5px solid var(--border-color); background:var(--bg-card); color:var(--text-primary); cursor:pointer; transition:0.2s; display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
        .btn:hover { background:rgba(0,0,0,0.02); border-color:var(--accent-2); }
        .btn-primary { background:var(--gradient-1); border:none; color:#fff; }
        .btn-primary:hover { opacity:0.9; }
        .content { padding:24px; max-width:800px; margin:0 auto; width:100%; }
        .card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:20px; margin-bottom:16px; box-shadow:var(--shadow-sm); }
        .profile-header { display:flex; align-items:center; gap:20px; flex-wrap:wrap; }
        .avatar-wrapper { position:relative; }
        .avatar-ring { width:90px; height:90px; border-radius:50%; padding:3px; background:var(--gradient-1); display:flex; align-items:center; justify-content:center; }
        .avatar-ring img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
        .avatar-upload { position:absolute; bottom:0; left:0; background:var(--gradient-1); border:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff; font-size:0.9rem; box-shadow:0 2px 8px rgba(0,0,0,0.2); }
        .badge { padding:3px 10px; border-radius:12px; font-size:0.7rem; font-weight:600; }
        .badge-success { background:rgba(44,122,123,0.15); color:#276749; }
        .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .info-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border-color); }
        .stats-inline { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
        .stat-circle { text-align:center; }
        .stat-circle svg { transform:rotate(-90deg); }
        .stat-circle .value { font-size:1.5rem; font-weight:800; }
        .table-wrapper { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:0.82rem; }
        th, td { padding:10px 12px; text-align:right; border-bottom:1px solid var(--border-color); }
        th { color:var(--text-muted); font-weight:600; font-size:0.7rem; }
        .message { padding:8px 12px; border-radius:14px; font-size:0.8rem; margin-top:8px; display:none; }
        .message.success { background:rgba(44,122,123,0.1); color:#276749; border:1px solid rgba(44,122,123,0.3); }
        .empty-state { text-align:center; padding:30px; color:var(--text-muted); }
        .theme-toggle { background:var(--bg-card); border:1px solid var(--border-color); border-radius:20px; padding:6px 10px; cursor:pointer; font-size:1rem; color:var(--text-primary); transition:0.2s; }
        .theme-toggle:hover { background:rgba(0,0,0,0.03); }
        @media (max-width:768px) {
            .sidebar { position:fixed; right:-280px; top:0; bottom:0; z-index:55; }
            .sidebar.open { right:0; }
            .info-grid { grid-template-columns:1fr; }
        }
        .menu-toggle { display:none; background:none; border:none; color:var(--text-primary); font-size:1.6rem; cursor:pointer; }
        @media (max-width:768px) { .menu-toggle { display:block; } }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:40; }
        .overlay.show { display:block; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
    <div class="logo-icon" id="sidebarLogo">M</div>
    <nav>
        <a href="dashboard.html">🏠 الرئيسية</a>
        <a href="assignments.html">📄 الواجبات</a>
        <a href="exams.html">📝 الامتحانات</a>
        <a href="schedule.html">📅 جداول الحصص</a>
        <a href="questions.html">💬 الأسئلة</a>
        <a href="profile.html" class="active">👤 حسابي</a>
        <a href="settings.html">⚙️ الإعدادات</a>
    </nav>
</aside>
<div class="main">
    <div class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h2>👤 الملف الشخصي</h2>
        <div style="display:flex; gap:10px; align-items:center;">
            <button class="theme-toggle" id="themeToggle" title="الوضع الليلي">🌙</button>
            <a href="dashboard.html" class="btn">رجوع</a>
        </div>
    </div>
    <div class="content" id="profileContent">⏳ جاري التحميل...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA4ilrZB4P8wwRDLdminQkwS9KYY50XY8c",
        authDomain: "mr-mohammed-elhafawy.firebaseapp.com",
        projectId: "mr-mohammed-elhafawy",
        storageBucket: "mr-mohammed-elhafawy.firebasestorage.app",
        messagingSenderId: "959200386071",
        appId: "1:959200386071:web:a70902bb0d6064e6081052"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const CLOUDINARY_CLOUD = "deaevfmvm", CLOUDINARY_PRESET = "ml_default", CLOUDINARY_KEY = "864215656447737";
    const studentId = localStorage.getItem('studentId');
    if (!studentId) window.location.href = 'login.html';

    const SUBJECTS = { 'الأول الإعدادي':'Science','الثاني الإعدادي':'Science','الثالث الإعدادي':'Science','الأول الثانوي':'Integrated Science','الثاني الثانوي':'Physics','الثالث الثانوي':'Physics' };

    // Theme
    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.getItem('darkMode') === 'true') { document.body.classList.add('dark'); themeToggle.textContent = '☀️'; }
    themeToggle.addEventListener('click', () => { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('darkMode', isDark); themeToggle.textContent = isDark ? '☀️' : '🌙'; });

    // Load logo
    (async function loadSettings() {
        const doc = await db.collection('settings').doc('platform').get().catch(() => null);
        if (doc && doc.exists && doc.data().logo) document.getElementById('sidebarLogo').innerHTML = `<img src="${doc.data().logo}" alt="لوجو">`;
    })();

    async function loadProfile() {
        const container = document.getElementById('profileContent');
        try {
            const doc = await db.collection('students').doc(studentId).get();
            if (!doc.exists || doc.data().status !== 'مفعل') { window.location.href='login.html'; return; }
            const user = doc.data();
            const grade = user.grade || '';
            const avatarUrl = localStorage.getItem('studentAvatar') || user.avatar || '';

            // إحصائيات
            let assignCount = 0, examResults = [];
            try { assignCount = (await db.collection('assignmentSubmissions').where('studentId','==',studentId).get()).size; } catch(e){}
            try {
                const snap = await db.collection('examResults').where('studentId','==',studentId).orderBy('createdAt','desc').limit(10).get();
                snap.forEach(d => examResults.push({id:d.id, ...d.data()}));
            } catch(e){}
            const avgScore = examResults.length ? Math.round(examResults.reduce((a,b)=>a+(b.percentage||0),0)/examResults.length) : 0;

            container.innerHTML = `
            <div class="card profile-header">
                <div class="avatar-wrapper">
                    <div class="avatar-ring">${avatarUrl ? `<img src="${avatarUrl}" alt="صورة">` : '👤'}</div>
                    <button class="avatar-upload" onclick="uploadAvatar()">📷</button>
                </div>
                <div><h2>${user.name||'طالب'}</h2><p style="color:var(--text-muted);">الصف: ${grade} | المادة: ${SUBJECTS[grade]||''} | <span class="badge badge-success">مفعل</span></p><div id="uploadMsg" class="message"></div></div>
            </div>
            <div class="card info-grid">
                <div class="info-row"><span>البريد</span><span>${user.email||'—'}</span></div>
                <div class="info-row"><span>الهاتف</span><span>${user.phone||'—'}</span></div>
                <div class="info-row"><span>ولي الأمر</span><span>${user.parentPhone||'—'}</span></div>
                <div class="info-row"><span>تاريخ التسجيل</span><span>${user.createdAt?.toDate?.().toLocaleDateString('ar-EG')||'—'}</span></div>
            </div>

            <div class="card">
                <h3 style="margin-bottom:16px;">📊 ملخص التقدم</h3>
                <div class="stats-inline">
                    <div class="stat-circle">
                        <svg width="100" height="100" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--border-color)" stroke-width="2.5"/><circle cx="18" cy="18" r="15.5" fill="none" stroke="url(#grad1)" stroke-width="2.5" stroke-dasharray="${avgScore},100" stroke-linecap="round"/><defs><linearGradient id="grad1"><stop offset="0%" stop-color="#3182ce"/><stop offset="100%" stop-color="#2c7a7b"/></linearGradient></defs></svg>
                        <div class="value">${avgScore}%</div><div style="color:var(--text-muted); font-size:0.8rem;">متوسط الدرجات</div>
                    </div>
                    <div class="stat-circle">
                        <svg width="100" height="100" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--border-color)" stroke-width="2.5"/><circle cx="18" cy="18" r="15.5" fill="none" stroke="#2b6cb0" stroke-width="2.5" stroke-dasharray="${Math.min((assignCount/15)*100,100)},100" stroke-linecap="round"/></svg>
                        <div class="value">${assignCount}</div><div style="color:var(--text-muted); font-size:0.8rem;">الواجبات المسلّمة</div>
                    </div>
                    <div class="stat-circle">
                        <svg width="100" height="100" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--border-color)" stroke-width="2.5"/><circle cx="18" cy="18" r="15.5" fill="none" stroke="#c53030" stroke-width="2.5" stroke-dasharray="${Math.min((examResults.length/10)*100,100)},100" stroke-linecap="round"/></svg>
                        <div class="value">${examResults.length}</div><div style="color:var(--text-muted); font-size:0.8rem;">الامتحانات المحلولة</div>
                    </div>
                </div>
            </div>

            <h3>📝 نتائج الامتحانات الأخيرة</h3>
            <div class="card table-wrapper">
                <table><thead><tr><th>الامتحان</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th></tr></thead>
                <tbody>${examResults.length ? examResults.map(r => `<tr><td>${r.examName||''}</td><td>${r.score||0}/${r.total||0}</td><td>${r.percentage||0}%</td><td>${r.createdAt?.toDate?.().toLocaleDateString('ar-EG')||''}</td></tr>`).join('') : '<tr><td colspan="4" class="empty-state">لا توجد نتائج بعد</td></tr>'}</tbody></table>
            </div>
            `;
        } catch(e) { container.innerHTML = '<div class="card empty-state">❌ خطأ في تحميل البيانات</div>'; }
    }
    loadProfile();

    window.uploadAvatar = function() {
        const msgEl = document.getElementById('uploadMsg');
        window.cloudinary.openUploadWidget({
            cloudName: CLOUDINARY_CLOUD, uploadPreset: CLOUDINARY_PRESET, apiKey: CLOUDINARY_KEY,
            sources: ['local','camera'], multiple: false, resourceType: 'image',
            clientAllowedFormats: ['png','jpg','jpeg'], maxFileSize: 5000000, language: 'ar'
        }, async (error, result) => {
            if (!error && result?.event === 'success') {
                const url = result.info.secure_url;
                await db.collection('students').doc(studentId).update({ avatar: url });
                localStorage.setItem('studentAvatar', url);
                msgEl.className = 'message success'; msgEl.style.display = 'block'; msgEl.textContent = '✅ تم تحديث الصورة';
                loadProfile();
            }
        });
    };

    // Mobile menu
    document.getElementById('menuToggle').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); });
    document.getElementById('overlay').addEventListener('click', () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); });
    window.logout = () => { localStorage.clear(); window.location.href = 'login.html'; };
</script>
</body>
</html>
