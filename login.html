<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Mr. Mohammed Elhafawy</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-primary: #f6f4f0;
            --bg-card: #ffffff;
            --text-primary: #1e2a3a;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --border-color: #e2dcd0;
            --accent-1: #3182ce;
            --accent-2: #2b6cb0;
            --accent-3: #2c7a7b;
            --gradient-1: linear-gradient(135deg, #3182ce, #2b6cb0, #2c7a7b);
            --gradient-2: linear-gradient(135deg, #2b6cb0, #3182ce, #2c7a7b);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.08);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --font: 'Cairo', sans-serif;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        body.dark {
            --bg-primary: #1a202c;
            --bg-card: #2d3748;
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --text-muted: #718096;
            --border-color: #4a5568;
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:var(--font);
            background:var(--bg-primary);
            color:var(--text-primary);
            display:flex; align-items:center; justify-content:center;
            min-height:100vh; padding:20px; transition: background 0.3s, color 0.3s;
        }
        .container { position:relative; width:100%; max-width:500px; animation:cardEnter 0.6s ease; }
        @keyframes cardEnter { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        .card {
            background:var(--bg-card); border:1px solid var(--border-color);
            border-radius:var(--radius-xl); padding:36px 28px; box-shadow:var(--shadow-lg);
            transition: background 0.3s;
        }
        .logo-icon {
            width:64px; height:64px; border-radius:18px; background:var(--gradient-1);
            display:flex; align-items:center; justify-content:center; font-weight:800; font-size:1.8rem;
            color:#fff; margin:0 auto 16px; overflow:hidden; box-shadow:0 6px 16px rgba(49,130,206,0.3);
        }
        .logo-icon img { width:100%; height:100%; object-fit:cover; border-radius:inherit; }
        .platform-name { text-align:center; font-size:1.4rem; font-weight:700; margin-bottom:4px; }
        .tabs { display:flex; gap:8px; margin-bottom:28px; }
        .tab-btn {
            flex:1; padding:10px; border-radius:30px; font-weight:600; font-size:0.9rem;
            border:1.5px solid var(--border-color); background:transparent; color:var(--text-secondary);
            cursor:pointer; transition:var(--transition); text-align:center;
        }
        .tab-btn.active { background:var(--gradient-1); border-color:transparent; color:#fff; }
        .form-panel { display:none; animation:fadeSlide 0.4s ease; }
        .form-panel.active { display:block; }
        @keyframes fadeSlide { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:0.85rem; margin-bottom:6px; color:var(--text-secondary); }
        .form-group input, .form-group select {
            width:100%; padding:13px 16px; border-radius:30px; border:1.5px solid var(--border-color);
            background:var(--bg-card); color:var(--text-primary); font-family:var(--font); font-size:0.9rem;
            outline:none; transition:0.25s;
        }
        .form-group input:focus, .form-group select:focus { border-color:var(--accent-2); box-shadow:0 0 0 4px rgba(49,130,206,0.1); }
        .phone-wrapper { display:flex; gap:8px; }
        .phone-wrapper select { width:90px; padding:13px 8px; border-radius:30px; border:1.5px solid var(--border-color); background:var(--bg-card); color:var(--text-primary); font-family:var(--font); font-size:0.9rem; outline:none; text-align:center; }
        .phone-wrapper input { flex:1; }
        .btn-submit {
            width:100%; padding:15px; border-radius:30px; font-weight:700; font-size:1rem; border:none;
            cursor:pointer; background:var(--gradient-1); color:#fff; transition:var(--transition);
            box-shadow:0 8px 20px rgba(49,130,206,0.3); margin-top:8px;
        }
        .btn-submit:hover { transform:translateY(-2px); box-shadow:0 12px 28px rgba(49,130,206,0.4); }
        .btn-submit:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
        .message { padding:12px 16px; border-radius:30px; font-size:0.85rem; text-align:center; margin-bottom:16px; display:none; }
        .error-message { background:rgba(197,48,48,0.1); border:1px solid rgba(197,48,48,0.3); color:#b91c1c; }
        .success-message { background:rgba(44,122,123,0.1); border:1px solid rgba(44,122,123,0.3); color:#276749; }
        .links { text-align:center; margin-top:16px; font-size:0.85rem; }
        .links a { color:var(--accent-1); text-decoration:none; font-weight:500; }
        .links a:hover { text-decoration:underline; }
        .spinner { display:inline-block; width:20px; height:20px; border:3px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s infinite linear; vertical-align:middle; margin-left:6px; }
        @keyframes spin { to{transform:rotate(360deg);} }
        .theme-toggle {
            background:var(--bg-card); border:1px solid var(--border-color); border-radius:24px;
            padding:8px 12px; cursor:pointer; font-size:1.1rem; color:var(--text-primary); transition:0.2s;
            position:absolute; top:16px; left:16px;
        }
        .theme-toggle:hover { background:rgba(0,0,0,0.03); }
        body.dark .theme-toggle:hover { background:rgba(255,255,255,0.05); }
        @media (max-width:480px) { .card { padding:30px 20px; border-radius:var(--radius-lg); } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <button class="theme-toggle" id="themeToggle" title="الوضع الليلي">🌙</button>
        <div class="card">
            <div class="logo-icon" id="loginLogo">M</div>
            <div class="platform-name" id="platformNameDisplay">Mr. Mohammed Elhafawy</div>
            <div class="tabs">
                <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">تسجيل الدخول</button>
                <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">إنشاء حساب</button>
            </div>

            <div class="error-message message" id="errorMsg"></div>
            <div class="success-message message" id="successMsg"></div>

            <!-- تسجيل الدخول -->
            <div class="form-panel active" id="loginPanel">
                <form id="loginForm" autocomplete="off">
                    <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="loginEmail" placeholder="example@email.com" required></div>
                    <div class="form-group"><label>كلمة المرور</label><input type="password" id="loginPassword" placeholder="••••••••" required></div>
                    <button type="submit" class="btn-submit" id="loginBtn">تسجيل الدخول</button>
                </form>
                <div class="links" style="margin-top:12px;"><a href="#" onclick="showForgotPassword()">نسيت كلمة المرور؟</a></div>
            </div>

            <!-- استعادة كلمة المرور -->
            <div class="form-panel" id="forgotPanel">
                <h3 style="text-align:center;margin-bottom:16px;">استعادة كلمة المرور</h3>
                <form id="forgotForm"><div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="forgotEmail" required></div><button type="submit" class="btn-submit">إرسال رابط الاستعادة</button></form>
                <div class="links"><a href="#" onclick="switchTab('login')">العودة لتسجيل الدخول</a></div>
            </div>

            <!-- إنشاء حساب -->
            <div class="form-panel" id="registerPanel">
                <form id="registerForm" autocomplete="off">
                    <div class="form-group"><label>الاسم بالكامل</label><input type="text" id="regName" placeholder="أدخل اسمك الكامل" required></div>
                    <div class="form-group"><label>رقم الهاتف</label><div class="phone-wrapper"><select id="regPhoneCode"><option value="+20" selected>+20</option></select><input type="tel" id="regPhone" placeholder="01234567890" required maxlength="11" inputmode="numeric" pattern="01[0-9]{9}"></div></div>
                    <div class="form-group"><label>رقم ولي الأمر</label><div class="phone-wrapper"><select id="regParentPhoneCode"><option value="+20" selected>+20</option></select><input type="tel" id="regParentPhone" placeholder="01234567890" required maxlength="11" inputmode="numeric" pattern="01[0-9]{9}"></div></div>
                    <div class="form-group"><label>البريد الإلكتروني</label><input type="email" id="regEmail" placeholder="example@email.com" required></div>
                    <div class="form-group"><label>كلمة المرور</label><input type="password" id="regPassword" placeholder="••••••••" required minlength="6"></div>
                    <div class="form-group"><label>الصف الدراسي</label>
                        <select id="regGrade" required>
                            <option value="">اختر الصف</option>
                            <option>الأول الإعدادي</option><option>الثاني الإعدادي</option><option>الثالث الإعدادي</option>
                            <option>الأول الثانوي</option><option>الثاني الثانوي</option><option>الثالث الثانوي</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-submit" id="registerBtn">إنشاء الحساب</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const firebaseConfig = {
                apiKey: "AIzaSyA4ilrZB4P8wwRDLdminQkwS9KYY50XY8c",
                authDomain: "mr-mohammed-elhafawy.firebaseapp.com",
                projectId: "mr-mohammed-elhafawy",
                storageBucket: "mr-mohammed-elhafawy.firebasestorage.app",
                messagingSenderId: "959200386071",
                appId: "1:959200386071:web:a70902bb0d6064e6081052"
            };
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();

            // Dark mode
            const themeToggle = document.getElementById('themeToggle');
            if (localStorage.getItem('darkMode') === 'true') { document.body.classList.add('dark'); themeToggle.textContent = '☀️'; }
            themeToggle.addEventListener('click', () => { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('darkMode', isDark); themeToggle.textContent = isDark ? '☀️' : '🌙'; });

            // Load platform settings
            (async function loadSettings() {
                const doc = await db.collection('settings').doc('platform').get().catch(() => null);
                if (doc && doc.exists) {
                    const data = doc.data();
                    if (data.logo) { document.getElementById('loginLogo').innerHTML = `<img src="${data.logo}" alt="لوجو">`; }
                    if (data.name) { document.getElementById('platformNameDisplay').textContent = data.name; document.title = `تسجيل الدخول | ${data.name}`; }
                }
            })();

            window.switchTab = function(tab) {
                document.getElementById('loginPanel').classList.remove('active');
                document.getElementById('registerPanel').classList.remove('active');
                document.getElementById('forgotPanel').classList.remove('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('tabRegister').classList.remove('active');
                document.getElementById('errorMsg').style.display='none';
                document.getElementById('successMsg').style.display='none';
                if(tab==='login') { document.getElementById('loginPanel').classList.add('active'); document.getElementById('tabLogin').classList.add('active'); }
                else { document.getElementById('registerPanel').classList.add('active'); document.getElementById('tabRegister').classList.add('active'); }
            };
            window.showForgotPassword = function() {
                document.getElementById('loginPanel').classList.remove('active');
                document.getElementById('registerPanel').classList.remove('active');
                document.getElementById('forgotPanel').classList.add('active');
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabRegister').classList.remove('active');
            };

            // Login
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value.trim(), password = document.getElementById('loginPassword').value;
                const errorMsg = document.getElementById('errorMsg'), successMsg = document.getElementById('successMsg');
                errorMsg.style.display='none'; successMsg.style.display='none';
                if(!email||!password){ errorMsg.textContent='يرجى إدخال البريد وكلمة المرور'; errorMsg.style.display='block'; return; }
                const btn = document.getElementById('loginBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> جاري الدخول...';
                try {
                    const userCred = await auth.signInWithEmailAndPassword(email, password);
                    const doc = await db.collection('students').doc(userCred.user.uid).get();
                    if(!doc.exists || doc.data().status !== 'مفعل') { await auth.signOut(); errorMsg.textContent='الحساب غير مفعل أو غير موجود'; errorMsg.style.display='block'; btn.disabled=false; btn.textContent='تسجيل الدخول'; return; }
                    localStorage.setItem('studentId', userCred.user.uid);
                    localStorage.setItem('studentName', doc.data().name||'طالب');
                    localStorage.setItem('studentGrade', doc.data().grade||'');
                    successMsg.textContent='تم الدخول!'; successMsg.style.display='block';
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } catch(err) {
                    errorMsg.textContent = err.code==='auth/user-not-found'?'البريد غير مسجل':err.code==='auth/wrong-password'?'كلمة مرور خاطئة':'خطأ';
                    errorMsg.style.display='block'; btn.disabled=false; btn.textContent='تسجيل الدخول';
                }
            });

            // Forgot password
            document.getElementById('forgotForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('forgotEmail').value.trim();
                const errorMsg = document.getElementById('errorMsg'), successMsg = document.getElementById('successMsg');
                errorMsg.style.display='none'; successMsg.style.display='none';
                if(!email){ errorMsg.textContent='أدخل البريد'; errorMsg.style.display='block'; return; }
                const btn = document.querySelector('#forgotForm .btn-submit'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span>...';
                try { await auth.sendPasswordResetEmail(email); successMsg.textContent='تم الإرسال'; successMsg.style.display='block'; btn.textContent='تم الإرسال'; }
                catch(err) { errorMsg.textContent = err.code==='auth/user-not-found'?'البريد غير مسجل':'خطأ'; errorMsg.style.display='block'; btn.disabled=false; btn.textContent='إرسال'; }
            });

            // Register
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('regName').value.trim();
                const phoneCode = document.getElementById('regPhoneCode').value;
                const phone = document.getElementById('regPhone').value.trim();
                const parentPhoneCode = document.getElementById('regParentPhoneCode').value;
                const parentPhone = document.getElementById('regParentPhone').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const password = document.getElementById('regPassword').value;
                const grade = document.getElementById('regGrade').value;
                const errorMsg = document.getElementById('errorMsg'), successMsg = document.getElementById('successMsg');
                errorMsg.style.display='none'; successMsg.style.display='none';
                const phoneRegex = /^01[0-9]{9}$/;
                if(!phoneRegex.test(phone)) { errorMsg.textContent='رقم الهاتف غير صحيح (يبدأ بـ 01 ويتكون من 11 رقم)'; errorMsg.style.display='block'; return; }
                if(!phoneRegex.test(parentPhone)) { errorMsg.textContent='رقم ولي الأمر غير صحيح'; errorMsg.style.display='block'; return; }
                if(!name||!email||!password||!grade) { errorMsg.textContent='يرجى ملء جميع الحقول'; errorMsg.style.display='block'; return; }
                const fullPhone = phoneCode + phone;
                const fullParentPhone = parentPhoneCode + parentPhone;
                const btn = document.getElementById('registerBtn'); btn.disabled=true; btn.innerHTML='<span class="spinner"></span> جاري إنشاء الحساب...';
                try {
                    const userCred = await auth.createUserWithEmailAndPassword(email, password);
                    await db.collection('students').doc(userCred.user.uid).set({
                        name, phone: fullPhone, parentPhone: fullParentPhone, email, grade,
                        status: 'قيد المراجعة', createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    await auth.signOut();
                    successMsg.textContent = 'تم إنشاء الحساب! انتظر التفعيل.';
                    successMsg.style.display='block'; btn.textContent = 'تم التسجيل';
                    setTimeout(() => switchTab('login'), 2500);
                } catch(err) {
                    errorMsg.textContent = err.code==='auth/email-already-in-use'?'البريد مستخدم بالفعل':err.code==='auth/weak-password'?'كلمة مرور ضعيفة':'خطأ';
                    errorMsg.style.display='block'; btn.disabled=false; btn.textContent='إنشاء الحساب';
                }
            });
        })();
    </script>

    <script>
    // حماية المنصة من أدوات المطور والسرقة
    (function() {
        // منع النقر بالزر الأيمن
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // منع اختصارات لوحة المفاتيح
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I (أدوات المطور)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J (الكونسول)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U (عرض المصدر)
            if (e.ctrlKey && e.keyCode === 85) {
                e.preventDefault();
                return false;
            }
            // Ctrl+S (حفظ الصفحة)
            if (e.ctrlKey && e.keyCode === 83) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C (أدوات المطور - عنصر)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
                e.preventDefault();
                return false;
            }
        });

        // كشف فتح أدوات المطور (اختياري - قد يزعج المطور)
        let devToolsOpen = false;
        const threshold = 160;
        setInterval(function() {
            const widthThreshold = window.outerWidth - window.innerWidth > threshold;
            const heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if (widthThreshold || heightThreshold) {
                if (!devToolsOpen) {
                    devToolsOpen = true;
                    alert('⚠️ لا يمكن استخدام أدوات المطور في هذه المنصة.');
                }
            } else {
                devToolsOpen = false;
            }
        }, 1000);
    })();
</script>
</body>
</html>
