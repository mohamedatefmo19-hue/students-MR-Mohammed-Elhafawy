<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم | Mr. Mohammed Elhafawy</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg-primary: #f6f4f0; --bg-card: #ffffff; --text-primary: #1e2a3a;
            --text-secondary: #4a5568; --text-muted: #718096; --border-color: #e2dcd0;
            --accent-1: #3182ce; --accent-2: #2b6cb0; --accent-3: #2c7a7b; --danger: #c53030;
            --gradient-1: linear-gradient(135deg, #3182ce, #2b6cb0, #2c7a7b);
            --radius-lg: 20px; --radius-md: 14px; --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06); --font: 'Cairo', sans-serif;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        body.dark {
            --bg-primary: #1a202c; --bg-card: #2d3748; --text-primary: #e2e8f0;
            --text-secondary: #a0aec0; --text-muted: #718096; --border-color: #4a5568;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3); --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { font-size:16px; }
        body {
            font-family:var(--font); background:var(--bg-primary); color:var(--text-primary);
            display:flex; min-height:100vh; overflow-x:hidden; transition: background 0.3s, color 0.3s;
        }
        @keyframes fadeInUp { from{opacity:0;transform:translateY(16px);} to{opacity:1;transform:translateY(0);} }
        .fade-in-up { animation:fadeInUp 0.4s ease both; }
        .sidebar {
            width:260px; background:var(--bg-card); border-left:1px solid var(--border-color);
            padding:24px 14px; display:flex; flex-direction:column; gap:4px; flex-shrink:0;
            z-index:50; transition:transform 0.3s; box-shadow:var(--shadow-sm);
        }
        .sidebar .logo { display:flex; align-items:center; gap:10px; padding:8px 12px; margin-bottom:20px; text-decoration:none; }
        .sidebar .logo-icon {
            width:42px; height:42px; border-radius:var(--radius-md); background:var(--gradient-1);
            display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff;
            font-size:1.1rem; overflow:hidden; flex-shrink:0;
        }
        .sidebar .logo-icon img { width:100%; height:100%; object-fit:cover; border-radius:inherit; }
        .sidebar .logo-text { font-weight:700; color:var(--text-primary); font-size:0.95rem; }
        .sidebar .logo-text small { display:block; font-size:0.65rem; color:var(--text-muted); font-weight:400; }
        .sidebar nav { display:flex; flex-direction:column; gap:2px; flex:1; }
        .sidebar nav a {
            display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:24px;
            color:var(--text-secondary); text-decoration:none; font-weight:500; font-size:0.88rem;
            transition:0.2s; cursor:pointer;
        }
        .sidebar nav a:hover, .sidebar nav a.active { background:rgba(49,130,206,0.08); color:var(--accent-2); }
        .sidebar nav a.active { background:rgba(49,130,206,0.1); }
        .sidebar-footer { margin-top:auto; padding-top:12px; border-top:1px solid var(--border-color); }
        .sidebar-footer button {
            width:100%; display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:24px;
            border:none; background:transparent; color:var(--danger); font-family:var(--font); font-weight:600;
            font-size:0.85rem; cursor:pointer; transition:0.2s;
        }
        .sidebar-footer button:hover { background:rgba(197,48,48,0.08); }
        .main { flex:1; display:flex; flex-direction:column; overflow-y:auto; max-height:100vh; background:var(--bg-primary); }
        .topbar {
            padding:14px 24px; display:flex; justify-content:space-between; align-items:center;
            background:var(--bg-card); border-bottom:1px solid var(--border-color);
            position:sticky; top:0; z-index:20; box-shadow:var(--shadow-sm);
        }
        .topbar h2 {
            font-size:1.2rem; font-weight:700;
            background:var(--gradient-1); -webkit-background-clip:text;
            -webkit-text-fill-color:transparent; background-clip:text;
        }
        .btn {
            padding:8px 16px; border-radius:24px; font-weight:600; font-size:0.82rem;
            border:1.5px solid var(--border-color); background:var(--bg-card); color:var(--text-primary);
            cursor:pointer; transition:0.2s; display:inline-flex; align-items:center; gap:6px; text-decoration:none;
        }
        .btn:hover { background:rgba(0,0,0,0.02); border-color:var(--accent-2); }
        .btn-primary { background:var(--gradient-1); border:none; color:#fff; }
        .content { padding:24px; flex:1; display:flex; flex-direction:column; gap:20px; }
        .card { background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow-sm); transition: background 0.3s; }
        .welcome-card { display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
        .avatar-ring {
            width:64px; height:64px; border-radius:50%; padding:3px; background:var(--gradient-1);
            flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:2rem; color:#fff; overflow:hidden;
        }
        .avatar-ring img { width:100%; height:100%; border-radius:50%; object-fit:cover; }
        .notifications-list { display:flex; flex-direction:column; gap:10px; }
        .notif-item {
            background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-md);
            padding:12px 16px; display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-sm);
        }
        .notif-item .dot { width:10px; height:10px; border-radius:50%; background:var(--accent-1); flex-shrink:0; }
        .quick-links { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:14px; }
        .quick-link {
            background:var(--bg-card); border:1px solid var(--border-color); border-radius:var(--radius-md);
            padding:18px 12px; text-align:center; text-decoration:none; color:var(--text-primary);
            box-shadow:var(--shadow-sm); transition:0.3s;
        }
        .quick-link:hover { transform:translateY(-3px); box-shadow:0 8px 18px rgba(0,0,0,0.08); }
        .quick-link .icon { font-size:1.8rem; margin-bottom:6px; }
        .quick-link .label { font-size:0.85rem; font-weight:600; }
        .empty-state { text-align:center; padding:30px; color:var(--text-muted); }
        .menu-toggle { display:none; background:none; border:none; color:var(--text-primary); font-size:1.6rem; cursor:pointer; }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:40; }
        .theme-toggle { background:var(--bg-card); border:1px solid var(--border-color); border-radius:20px; padding:6px 10px; cursor:pointer; font-size:1rem; color:var(--text-primary); transition:0.2s; }
        .theme-toggle:hover { background:rgba(0,0,0,0.03); }
        @media (max-width:768px) {
            .sidebar { position:fixed; right:-280px; top:0; bottom:0; z-index:55; }
            .sidebar.open { right:0; }
            .overlay.show { display:block; }
            .menu-toggle { display:block; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
    <a href="index.html" class="logo">
        <div class="logo-icon" id="sidebarLogo">M</div>
        <span class="logo-text" id="sidebarPlatformName">لوحة التحكم<small>Mr. Mohammed Elhafawy</small></span>
    </a>
    <nav>
        <a class="active" href="dashboard.html">🏠 الرئيسية</a>
        <a href="assignments.html">📄 الواجبات</a>
        <a href="exams.html">📝 الامتحانات</a>
        <a href="schedule.html">📅 جداول الحصص</a>
        <a href="questions.html">💬 الأسئلة</a>
        <a href="profile.html">👤 حسابي</a>
        <a href="settings.html">⚙️ الإعدادات</a>
    </nav>
    <div class="sidebar-footer">
        <button onclick="logout()">🚪 تسجيل الخروج</button>
    </div>
</aside>

<div class="main">
    <div class="topbar">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <h2>📊 لوحة التحكم</h2>
        <div style="display:flex; gap:10px; align-items:center;">
            <button class="theme-toggle" id="themeToggle" title="الوضع الليلي">🌙</button>
            <a href="index.html" class="btn">الموقع</a>
        </div>
    </div>
    <div class="content" id="dashboardContent">
        <div class="card"><p>⏳ جاري تحميل بياناتك...</p></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA4ilrZB4P8wwRDLdminQkwS9KYY50XY8c",
        authDomain: "mr-mohammed-elhafawy.firebaseapp.com",
        projectId: "mr-mohammed-elhafawy",
        storageBucket: "mr-mohammed-elhafawy.firebasestorage.app",
        messagingSenderId: "959200386071",
        appId: "1:959200386071:web:a70902bb0d6064e6081052"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const studentId = localStorage.getItem('studentId');
    if (!studentId) { window.location.href = 'login.html'; }

    // Dark mode
    const themeToggle = document.getElementById('themeToggle');
    if (localStorage.getItem('darkMode') === 'true') { document.body.classList.add('dark'); themeToggle.textContent = '☀️'; }
    themeToggle.addEventListener('click', () => { document.body.classList.toggle('dark'); const isDark = document.body.classList.contains('dark'); localStorage.setItem('darkMode', isDark); themeToggle.textContent = isDark ? '☀️' : '🌙'; });

    // Load platform settings
    (async function loadSettings() {
        const doc = await db.collection('settings').doc('platform').get().catch(() => null);
        if (doc && doc.exists) {
            const data = doc.data();
            if (data.logo) { document.getElementById('sidebarLogo').innerHTML = `<img src="${data.logo}" alt="لوجو">`; }
            if (data.name) {
                document.getElementById('sidebarPlatformName').innerHTML = `لوحة التحكم<small>${data.name}</small>`;
                document.title = `لوحة التحكم | ${data.name}`;
            }
        }
    })();

    // Load dashboard
    (async function loadDashboard() {
        const container = document.getElementById('dashboardContent');
        try {
            const userDoc = await db.collection('students').doc(studentId).get();
            if (!userDoc.exists || userDoc.data().status !== 'مفعل') { localStorage.clear(); window.location.href='login.html'; return; }
            const user = userDoc.data();
            const grade = user.grade || '';
            const avatarUrl = localStorage.getItem('studentAvatar') || user.avatar || '';
            const SUBJECTS = { 'الأول الإعدادي':'Science','الثاني الإعدادي':'Science','الثالث الإعدادي':'Science','الأول الثانوي':'Integrated Science','الثاني الثانوي':'Physics','الثالث الثانوي':'Physics' };

            // البحث عن مجموعة الطالب
            let groupId = null;
            try {
                const gSnap = await db.collection('groups').where('grade','==',grade).get();
                if (!gSnap.empty) { for (const g of gSnap.docs) { if (g.data().students?.includes(studentId)) { groupId = g.id; break; } } }
            } catch(e) {}

            // ✅ جلب الإشعارات بالطريقة الصحيحة
            const now = new Date();
            let notifications = [];
            try {
                const allSnap = await db.collection('notifications').where('expiresAt','>',now).orderBy('expiresAt','asc').get().catch(() => ({ empty:true, docs:[] }));
                if (!allSnap.empty) {
                    allSnap.forEach(doc => {
                        const n = doc.data();
                        // ✅ التعديل: شرط الصف أصبح دقيقاً
                        const gradeMatch = n.targetGrade === 'all' || n.targetGrade === grade;
                        const groupMatch = n.targetGroupId === groupId || !n.targetGroupId;
                        const studentMatch = n.targetStudentId === studentId || !n.targetStudentId;
                        if ((gradeMatch && groupMatch) || studentMatch) {
                            notifications.push({id:doc.id, ...n});
                        }
                    });
                }
            } catch(e) {}

            container.innerHTML = `
            <div class="card welcome-card fade-in-up">
                <div class="avatar-ring">${avatarUrl ? `<img src="${avatarUrl}" alt="صورة">` : '👤'}</div>
                <div>
                    <h3>مرحباً، ${user.name || 'طالب'} 👋</h3>
                    <p style="color:var(--text-muted);">الصف: ${grade} | المادة: ${SUBJECTS[grade]||''} | <span style="color:var(--accent-3);">مفعل</span></p>
                </div>
            </div>
            <div class="card fade-in-up">
                <h3>🔔 الإشعارات</h3>
                <div class="notifications-list">
                    ${notifications.length ? notifications.map(n => `
                        <div class="notif-item">
                            <span class="dot"></span>
                            <div style="flex:1;"><strong>${n.title||'إشعار'}</strong><p style="color:var(--text-secondary);font-size:0.85rem;">${n.body||''}</p></div>
                            <span style="color:var(--text-muted);font-size:0.72rem;">${n.expiresAt?.toDate?.().toLocaleString('ar-EG')||''}</span>
                        </div>`).join('') : '<div class="empty-state">لا توجد إشعارات حالياً</div>'}
                </div>
            </div>
            <h3>⚡ روابط سريعة</h3>
            <div class="quick-links">
                <a href="assignments.html" class="quick-link fade-in-up"><div class="icon">📄</div><div class="label">الواجبات</div></a>
                <a href="exams.html" class="quick-link fade-in-up"><div class="icon">📝</div><div class="label">الامتحانات</div></a>
                <a href="schedule.html" class="quick-link fade-in-up"><div class="icon">📅</div><div class="label">جداول الحصص</div></a>
                <a href="questions.html" class="quick-link fade-in-up"><div class="icon">💬</div><div class="label">الأسئلة</div></a>
            </div>`;
        } catch(e) {
            container.innerHTML = '<div class="card"><p>❌ حدث خطأ في تحميل البيانات</p></div>';
        }
    })();

    // Mobile menu
    document.getElementById('menuToggle').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    });
    document.getElementById('overlay').addEventListener('click', () => {
        document.getElementById('sidebar').classList.remove('open');
        document.getElementById('overlay').classList.remove('show');
    });

    window.logout = () => { localStorage.clear(); window.location.href = 'login.html'; };
</script>
<script>
    // حماية المنصة من أدوات المطور والسرقة
    (function() {
        // منع النقر بالزر الأيمن
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        // منع اختصارات لوحة المفاتيح
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I (أدوات المطور)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J (الكونسول)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U (عرض المصدر)
            if (e.ctrlKey && e.keyCode === 85) {
                e.preventDefault();
                return false;
            }
            // Ctrl+S (حفظ الصفحة)
            if (e.ctrlKey && e.keyCode === 83) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C (أدوات المطور - عنصر)
            if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
                e.preventDefault();
                return false;
            }
        });

        // كشف فتح أدوات المطور (اختياري - قد يزعج المطور)
        let devToolsOpen = false;
        const threshold = 160;
        setInterval(function() {
            const widthThreshold = window.outerWidth - window.innerWidth > threshold;
            const heightThreshold = window.outerHeight - window.innerHeight > threshold;
            if (widthThreshold || heightThreshold) {
                if (!devToolsOpen) {
                    devToolsOpen = true;
                    alert('⚠️ لا يمكن استخدام أدوات المطور في هذه المنصة.');
                }
            } else {
                devToolsOpen = false;
            }
        }, 1000);
    })();
</script>
    
</body>
</html>
